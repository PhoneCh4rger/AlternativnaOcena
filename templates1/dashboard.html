<!DOCTYPE html>
<html>
<head>
    <title>Zapiski</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<h1>Zapiski</h1>
<h3>Pozdravljen {{ user }}</h3>

<textarea id="naslov" placeholder="Naslov"></textarea><br>
<textarea id="vsebina" placeholder="Vsebina"></textarea><br>
<button onclick="dodaj()">Shrani</button>

<hr>

{% for z in zapiski %}
<div id="zapis-{{ z.naslov }}">
    <div class="prikaz">
    <b>{{ z.naslov }}</b>
    <p>{{ z.vsebina }}</p>
    <button onclick="izbrisi('{{ z.naslov }}')">Izbriši</button>
    <button onclick="uredi('{{ z.naslov }}')">Uredi</button> 
    </div>

    <div class="urejanje" style="display:none;">
        <input type="text" class="nov-naslov" value="{{ z.naslov }}"><br>
        <textarea class="nova-vsebina">{{ z.vsebina }}</textarea><br>
        <button onclick="shraniUredi('{{ z.naslov }}')">Shrani</button>
        <button onclick="preklici('{{ z.naslov }}')">Prekliči</button>
    </div>
</div>
{% endfor %}

<br>
<button onclick="logout()">Logout</button>

<script>
function dodaj() {
    let naslov = $("#naslov").val();
    let vsebina = $("#vsebina").val();

    if (naslov == "" || vsebina == "") {
        alert("Izpolni vse");
        return;
    }

    $.ajax({
        url: "/dodaj",
        type: "POST",
        data: {
            naslov: naslov,
            vsebina: vsebina
        },
        success: function() {
            location.reload();
        }
    });
}

function izbrisi(naslov) {
    $.ajax({
        url: "/izbrisi",
        type: "POST",
        data: {
            naslov: naslov
        },
        success: function() {
            location.reload();
        }
    });
}

function uredi(naslov) {
    let div = $("#zapis-" + naslov);
    div.find(".prikaz").hide();
    div.find(".urejanje").show();
}

function shraniUredi(stari_naslov) {
    let div = $("#zapis-" + stari_naslov);
    let nov_naslov = div.find(".nov-naslov").val();
    let nova_vsebina = div.find(".nova-vsebina").val();
    if (!nov_naslov || !nova_vsebina) return;
    $.ajax({
        url: "/uredi",
        type: "POST",
        data: { stari_naslov: stari_naslov, naslov: nov_naslov, vsebina: nova_vsebina },
        success: function() { location.reload(); }
    });
}

function preklici(naslov) {
    let div = $("#zapis-" + naslov);
    div.find(".urejanje").hide();
    div.find(".prikaz").show();
}

function logout() {
    window.location.href = "/logout";
}
</script>

</body>
</html>
